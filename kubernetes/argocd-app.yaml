apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-auto-remediation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/humeshdeshmukh/chaos-engineering-auto-remediation.git'
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
