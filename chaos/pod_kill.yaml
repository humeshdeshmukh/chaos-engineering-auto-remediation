apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: payment-gateway-pod-kill
  namespace: default
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      'app': 'payment-gateway'
      'rollouts-pod-template-hash': 'CANARY_HASH'
  duration: '5m'
